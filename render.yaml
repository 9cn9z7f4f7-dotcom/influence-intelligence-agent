# Render Blueprint - деплой одним кликом (Render -> New -> Blueprint).
# Не обязателен: то же самое можно настроить руками в Render dashboard,
# указав те же Build/Start Command (см. ниже) - этот файл просто избавляет
# от ручного клика по полям в UI.
services:
  - type: web
    name: influence-intelligence-agent
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py serve
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Опционально - для live YouTube discovery. Если не задать, приложение
      # честно работает в degraded-режиме (unavailable + import fallback),
      # как и в остальной среде без ключа.
      - key: YOUTUBE_API_KEY
        sync: false
      # Опционально - для LLM-формулировок (guardrails/topic ambiguous cases).
      # Без ключа - deterministic fallback, ничего не падает.
      - key: ANTHROPIC_API_KEY
        sync: false
      # --- Real-data update: все переменные ниже опциональны, backward-compatible ---
      # OpenRouter (текст/vision enrichment, раздел 1). Без ключа -
      # visual_ai_status=unavailable, deterministic fallback, pipeline не падает.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: OPENROUTER_VISION_MODEL
        sync: false
      # Опционально - реальный (не fake) search backend для Articles/Web платформы
      # (раздел 5). Tavily - PRIMARY provider (точечная доработка); SerpAPI -
      # FALLBACK, если Tavily не задан/недоступен. Если ни один ключ не задан -
      # articles honestly unavailable + import fallback (без demo/synthetic).
      - key: TAVILY_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      # Опционально - shared secret, которым local_connector/run.py авторизуется
      # при регистрации (раздел 11). Без него - любой connector может
      # зарегистрироваться (ок для локальной demo/hackathon-эксплуатации).
      - key: CONNECTOR_SHARED_SECRET
        sync: false
      - key: CONNECTOR_OFFLINE_AFTER_SECONDS
        sync: false
